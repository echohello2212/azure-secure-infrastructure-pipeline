name: Deploy
on:
  push:
    branches:
      [main]
    paths:
      - "network/**"
      - "datastores/**"

  workflow_dispatch:
    inputs:
      root:
        description: Root to deploy
        type: choice
        options:
          - network
          - datastores
          - compute
          - connectivity
          - full startup

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false
    
jobs:
  network:
    if: github.event_name == 'push' || inputs.root == 'network' || inputs.root == 'full startup'
    uses: ./.github/workflows/deploy-root.yml
    with:
      root: "network"
    secrets: inherit

  datastores:
    needs: network
    #Runs on a push or a datastores or full startup dispatch, unless an earlier job failed
    if: ${{ !failure() && (github.event_name == 'push' || inputs.root == 'datastores' || inputs.root == 'full startup') }}
    uses: ./.github/workflows/deploy-root.yml
    with:
      root: "datastores"
    secrets: inherit

  compute:
    needs: network
    if: ${{ !failure() && (inputs.root == 'compute' || inputs.root == 'full startup') }}
    uses: ./.github/workflows/deploy-root.yml
    with:
      root: "compute"
    secrets: inherit

  connectivity:
    needs: [network, compute]
    if: ${{ !failure() && (inputs.root == 'connectivity' || inputs.root == 'full startup') }}
    uses: ./.github/workflows/deploy-root.yml
    with:
      root: "connectivity"
    secrets: inherit