name: Destroy
#checkov:skip=CKV_GHA_7:dispatch inputs are operational controls, not build parameters
on:
  workflow_dispatch:
    inputs:
      root:
        description: Root to destroy
        type: choice
        #Destroy in reverse build order, stateful roots are left out on purpose
        options:
          - connectivity
          - compute
          - frontdoor
      confirm:
        type: string
        description: "must type the root name again to confirm"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: confirm root
        env:
          root: ${{ inputs.root }}
          confirm: ${{ inputs.confirm }}
        run: |
          if [ "$root" != "$confirm" ]; then
            echo "Confirmation failed, expected $root but got $confirm"
            exit 1
          fi
  
  destroy-plan:
    needs: check
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.root }}
    env:
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_ssh_public_key: ${{ secrets.ASIP_SSH_PUBLIC_KEY }}
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    #Short-lived token from the trust, no stored cloud password
    - name: azure login
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: "1.16.5"

    #Backend uses the signed-in identity, no storage keys
    - name: terraform init
      run: terraform init -input=false

    #Waits up to 5 minutes for the state lock, then fails
    - name: terraform plan destroy
      shell: bash
      run: terraform plan -destroy -no-color -input=false -lock-timeout=5m | tee plan.txt

    - name: plan summary
      if: always()
      run: |
        echo '### Terraform Destroy Plan' >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        cat plan.txt >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"


  destroy-apply:
    needs: destroy-plan
    environment: deploy
    env:
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_ssh_public_key: ${{ secrets.ASIP_SSH_PUBLIC_KEY }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.root }}
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: "1.16.5"

    - name: azure login
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: terraform init
      run: terraform init -input=false

    - name: terraform plan destroy
      run: terraform plan -destroy -out=tfplan -input=false -lock-timeout=5m

    - name: terraform apply destroy
      run: terraform apply -input=false -lock-timeout=5m tfplan
